AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SLA monitoring API - stateless FastAPI on AWS Lambda behind a Function URL.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: SQLAlchemy URL, e.g. postgresql+psycopg2://user:pass@host/db?sslmode=require
  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins allowed to call the API (the frontend URL).

Resources:
  SlaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/dist/lambda.zip # built by backend/scripts/package_lambda.sh
      Handler: lambda_handler.handler
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          CORS_ORIGINS: !Ref CorsOrigins
      FunctionUrlConfig:
        AuthType: NONE # no auth is an explicit requirement of the assignment
        # CORS is handled by FastAPI's middleware, so the URL-level CORS config is left off
        # to avoid duplicate Access-Control-* headers.

Outputs:
  ApiUrl:
    Description: Base URL of the API (set as VITE_API_URL in the frontend build)
    Value: !GetAtt SlaApiFunctionUrl.FunctionUrl
